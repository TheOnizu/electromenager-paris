services:
  # ── Base de données PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: electromenager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d electromenager"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── PostgREST (API REST compatible Supabase) ─────────────────────────────────
  rest:
    image: postgrest/postgrest:v12.2.8
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/electromenager
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # JWT signé avec le secret LOCAL uniquement (ne jamais utiliser en prod)
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_MAX_ROWS: 1000
    depends_on:
      db:
        condition: service_healthy

  # ── Nginx (proxy /rest/v1/ → PostgREST) ─────────────────────────────────────
  api:
    image: nginx:1.25-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rest

  # ── MailHog (capture des emails en local) ────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web → http://localhost:8025

  # ── Application Nuxt ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    env_file:
      - .env.docker
    depends_on:
      - api
      - mailhog

volumes:
  pgdata:
